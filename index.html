<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pablo: Una Odisea en el Sur</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Courier New', Courier, monospace; color: white; touch-action: none; }
        canvas { display: block; background: #87CEEB; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; text-shadow: 2px 2px #000; }
        #dialogue { position: absolute; bottom: 20%; width: 100%; text-align: center; font-size: 1.2rem; background: rgba(0,0,0,0.6); padding: 10px 0; display: none; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="level-title">NIVEL 1: Banfield en Bici</div>
        <div id="stats">Pedido: 100% | Integridad: 100%</div>
    </div>
    <div id="dialogue"></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dialogueBox = document.getElementById('dialogue');

// Configuración de pantalla
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = Math.min(window.innerHeight, 400);
}
window.addEventListener('resize', resize);
resize();

// Estados del Juego
let gameState = {
    level: 1,
    gameOver: false,
    distance: 0,
    speed: 5,
    pabloY: 0,
    isJumping: false,
    isDucking: false,
    jumpV: 0,
    obstacles: [],
    frame: 0,
    messageTimer: 0
};

// Configuración de Niveles
const LEVELS = {
    1: { title: "NIVEL 1: Lomas - El Reparto", bg: "#87CEEB", ground: "#555", mode: "bike" },
    2: { title: "NIVEL 2: La Vereda - Caminando", bg: "#a8dadc", ground: "#777", mode: "walk" },
    3: { title: "NIVEL 3: Camino Negro - El Camión", bg: "#457b9d", ground: "#333", mode: "truck" },
    4: { title: "NIVEL 4: El Plano Espectral", bg: "#1d3557", ground: "#f1faee", mode: "soul" }
};

class Obstacle {
    constructor(type, x) {
        this.x = x;
        this.type = type; // 'hole', 'dog', 'bus', 'door', 'cloud'
        this.w = 50;
        this.h = 30;
        this.y = canvas.height - 50;
        
        if(type === 'bus') { this.w = 120; this.h = 60; this.y = canvas.height - 80; }
        if(type === 'cloud') { this.y = canvas.height - 120; }
    }

    draw() {
        ctx.fillStyle = this.type === 'bus' ? '#e63946' : '#000';
        if(gameState.level === 4) ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.fillRect(this.x, this.y, this.w, this.h);
        
        ctx.fillStyle = "white";
        ctx.font = "10px Arial";
        ctx.fillText(this.type.toUpperCase(), this.x + 5, this.y + 15);
    }
}

function update() {
    if(gameState.gameOver) return;

    gameState.frame++;
    gameState.distance += gameState.speed / 10;

    // Lógica de Salto/Gravedad
    if(gameState.isJumping) {
        gameState.pabloY += gameState.jumpV;
        gameState.jumpV += 0.8; // Gravedad
        if(gameState.pabloY >= 0) {
            gameState.pabloY = 0;
            gameState.isJumping = false;
        }
    }

    // Generar Obstáculos
    if(gameState.frame % 100 === 0) {
        let type = 'hole';
        if(gameState.level === 1) type = Math.random() > 0.5 ? 'hole' : 'bus';
        if(gameState.level === 2) type = 'dog';
        if(gameState.level === 3) type = 'bus';
        if(gameState.level === 4) type = 'cloud';
        gameState.obstacles.push(new Obstacle(type, canvas.width));
    }

    // Mover Obstáculos
    gameState.obstacles.forEach((obs, index) => {
        obs.x -= gameState.speed;
        
        // Colisión simple
        if(obs.x < 100 && obs.x + obs.w > 50 && (gameState.pabloY + canvas.height - 70) > obs.y) {
            if(gameState.level === 3) {
                triggerDeath(); // Muerte obligatoria nivel 3
            } else {
                // Penalización menor
            }
        }
    });

    // Transiciones de Nivel
    if(gameState.distance > 100 && gameState.level === 1) nextLevel(2);
    if(gameState.distance > 200 && gameState.level === 2) nextLevel(3);
    if(gameState.distance > 350 && gameState.level === 3) { /* El choque ocurre por obstáculos */ }

    draw();
    requestAnimationFrame(update);
}

function nextLevel(num) {
    gameState.level = num;
    gameState.distance = 0;
    gameState.obstacles = [];
    document.getElementById('level-title').innerText = LEVELS[num].title;
    
    if(num === 2) {
        gameState.speed = 3; // Pablo camina lento
        showMessage("¡Se rompió la cadena! A caminar...");
    }
    if(num === 3) {
        gameState.speed = 12; // A toda velocidad
        showMessage("¡Me agarro de este camión! Cuidado...");
    }
}

function triggerDeath() {
    gameState.level = 4;
    gameState.speed = 4;
    document.getElementById('level-title').innerText = LEVELS[4].title;
    showMessage("El cuerpo quedó en el asfalto... el alma sigue entregando.");
}

function showMessage(txt) {
    dialogueBox.innerText = txt;
    dialogueBox.style.display = 'block';
    setTimeout(() => dialogueBox.style.display = 'none', 4000);
}

function draw() {
    const current = LEVELS[gameState.level];
    ctx.fillStyle = current.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Suelo
    ctx.fillStyle = current.ground;
    ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

    // Pablo
    ctx.fillStyle = gameState.level === 4 ? "rgba(200, 255, 255, 0.8)" : "#333";
    let pabloHeight = gameState.isDucking ? 25 : 50;
    ctx.fillRect(50, canvas.height - 70 + gameState.pabloY, 30, pabloHeight);
    
    // Mochila de repartidor
    ctx.fillStyle = "#ff5722";
    ctx.fillRect(40, canvas.height - 65 + gameState.pabloY, 15, 30);

    // Dibujar obstáculos
    gameState.obstacles.forEach(obs => obs.draw());
}

// Controles
function handleInput() {
    if(!gameState.isJumping) {
        gameState.isJumping = true;
        gameState.jumpV = -12;
    }
}

window.addEventListener('keydown', (e) => { if(e.code === 'Space' || e.code === 'ArrowUp') handleInput(); });
window.addEventListener('touchstart', handleInput);

update();
</script>
</body>
</html>
