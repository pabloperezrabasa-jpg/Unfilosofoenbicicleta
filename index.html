<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Pablo: El Filósofo de Rappi — De Vuelta a Casa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070E;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;touch-action:none}
#ttl{color:#F5C518;font:bold 9px 'Courier New',monospace;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;text-align:center}
canvas{display:block;cursor:pointer;max-width:100vw;max-height:90vh;touch-action:none}
#ftr{color:#222;font:9px 'Courier New',monospace;margin-top:3px;text-align:center;letter-spacing:1px}
</style>
</head>
<body>
<div id="ttl">★ pablo: el filósofo de rappi — de vuelta a casa ★</div>
<canvas id="c"></canvas>
<div id="ftr">⌨ ESPACIO=saltar · X=libro · flechas=volar(Ep4) · 📱 botones en pantalla</div>
<script>
'use strict';
const C=document.getElementById('c');
const ctx=C.getContext('2d');
const W=800,H=450;
C.width=W;C.height=H;

const FY=362,PX=150,JV=-15,GR=0.64,GGR=0.28,GFL=-7;
let gs='title',ep=1,hp=100,pts=0,hiscore=0,fr=0,sh=0,invT=0,crashT=0,endT=0;
let lives=4,coins=0,booksGot=0,combo=0,comboT=0;
let popups=[]; // floating score texts
let P={},E={};
const DLG={lines:[],i:0};
const rng=n=>{const s=Math.sin(n*127.1+311)*43758.5453;return s-Math.floor(s);};

// ── keyboard state ──
const K={up:false,down:false,left:false,right:false};

// ── canvas-drawn virtual buttons (positions in game coords 0..W, 0..H) ──
// Each btn: {x,y,r,label,color,action,ep4only,hideEp4}
const BTNS=[
  {id:'jump', x:68, y:H-68, r:34, label:'↑',   col:'rgba(33,150,243,0.78)',  hideEp4:true},
  {id:'duck', x:68, y:H-14, r:24, label:'↓',   col:'rgba(120,60,200,0.72)',  hideEp4:true},
  {id:'book', x:W-68,y:H-68,r:34, label:'📚',  col:'rgba(183,28,28,0.78)',   ep4:false},
  {id:'up',   x:W-68,y:H-120,r:28,label:'▲',   col:'rgba(0,188,212,0.78)',   ep4only:true},
  {id:'dn',   x:W-68,y:H-56, r:28,label:'▼',   col:'rgba(0,150,136,0.78)',   ep4only:true},
  {id:'lf',   x:W-148,y:H-56,r:28,label:'◀',   col:'rgba(96,125,139,0.78)', ep4only:true},
  {id:'rt',   x:W-68, y:H-56,r:28,label:'▶',   col:'rgba(96,125,139,0.78)', ep4only:true},
];
// active press state
const BSTATE={};

function visibleBtns(){
  const ghost=ep===4&&gs==='play';
  return BTNS.filter(b=>{
    if(b.ep4only&&!ghost)return false;
    if(b.hideEp4&&ghost)return false;
    return true;
  });
}

// ── map real touch/click coords to canvas coords ──
function canvasXY(clientX,clientY){
  const r=C.getBoundingClientRect();
  return {
    x:(clientX-r.left)*(W/r.width),
    y:(clientY-r.top)*(H/r.height)
  };
}

function btnAt(cx,cy){
  for(const b of visibleBtns()){
    if(Math.hypot(cx-b.x,cy-b.y)<b.r+8)return b;
  }
  return null;
}

function handleBtnDown(b){
  if(!b)return;
  BSTATE[b.id]=true;
  if(b.id==='jump'){if(gs==='play')tryJump();else onInput();}
  else if(b.id==='duck'){if(gs!=='play'){onInput();return;}K.down=true;if(P)P.duck=true;}
  else if(b.id==='book'){if(gs==='play')throwBook();else onInput();}
  else if(b.id==='up'){K.up=true;if(gs==='play'&&ep===4)P.vy=GFL;}
  else if(b.id==='dn'){K.down=true;}
  else if(b.id==='lf'){K.left=true;}
  else if(b.id==='rt'){K.right=true;}
}
function handleBtnUp(b){
  if(!b)return;
  BSTATE[b.id]=false;
  if(b.id==='duck'){K.down=false;if(P)P.duck=false;}
  else if(b.id==='up')K.up=false;
  else if(b.id==='dn')K.down=false;
  else if(b.id==='lf')K.left=false;
  else if(b.id==='rt')K.right=false;
}

// Track which touch id => which button
const touchMap={};
C.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const {x,y}=canvasXY(t.clientX,t.clientY);
    const b=btnAt(x,y);
    if(b){touchMap[t.identifier]=b.id;handleBtnDown(b);}
    else if(gs!=='play')onInput();
  }
},{passive:false});
C.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const id=touchMap[t.identifier];
    if(id){handleBtnUp(BTNS.find(b=>b.id===id));delete touchMap[t.identifier];}
  }
},{passive:false});
C.addEventListener('touchcancel',e=>{
  for(const t of e.changedTouches){
    const id=touchMap[t.identifier];
    if(id){handleBtnUp(BTNS.find(b=>b.id===id));delete touchMap[t.identifier];}
  }},{passive:false});

// Mouse fallback (desktop)
let mouseBtn=null;
C.addEventListener('mousedown',e=>{
  const {x,y}=canvasXY(e.clientX,e.clientY);
  const b=btnAt(x,y);
  if(b){mouseBtn=b;handleBtnDown(b);}
  else if(gs!=='play')onInput();
});
C.addEventListener('mouseup',()=>{if(mouseBtn){handleBtnUp(mouseBtn);mouseBtn=null;}});

// ── keyboard (unchanged for PC) ──
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowUp')K.up=false;
  if(e.code==='ArrowDown'){K.down=false;if(P&&P.mode!=='ghost')P.duck=false;}
  if(e.code==='ArrowLeft')K.left=false;
  if(e.code==='ArrowRight')K.right=false;
  if(e.code==='KeyS'){K.down=false;if(P)P.duck=false;}
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();onInput();return;}
  if(e.code==='ArrowUp'){e.preventDefault();K.up=true;if(gs==='play')tryJump();return;}
  if(e.code==='ArrowDown'){e.preventDefault();K.down=true;if(gs==='play'&&ep!==4)P.duck=true;return;}
  if(e.code==='KeyS'){K.down=true;if(gs==='play'&&ep!==4)P.duck=true;return;}
  if(e.code==='ArrowLeft')K.left=true;
  if(e.code==='ArrowRight')K.right=true;
  if(e.code==='KeyX'&&gs==='play')throwBook();
});

function onInput(){
  if(gs==='title'){startEp(1);return;}
  if(gs==='dlg'){advDlg();return;}
  if(gs==='play'){tryJump();return;}
  if(gs==='ep_end'){nextEp();return;}
  if(gs==='gameover'){retryEp();return;}
  if(gs==='ending'&&endT>300){resetAll();return;}
}
function tryJump(){
  if(ep===4){P.vy=GFL;return;}
  if(P.gnd&&!P.duck){P.vy=JV;P.gnd=false;P.jumps=1;return;}
  // double jump
  if(P.jumps===1){P.vy=JV*0.82;P.jumps=2;sh=4;}
}

// ── thrown books ──
let thrown=[],explosions=[];
function throwBook(){
  if(E.booksThrown!==undefined)E.booksThrown++;
  thrown.push({x:P.x+22,y:P.y-62,vx:13+E.spd*0.4,vy:-4,alive:true});
}
function addTurbo(){E.turbo=true;E.turboT=180;sh=8;addPopup(P.x,P.y-100,'⚡ TURBO!','#FFD700',18);}
function addPopup(x,y,txt,col,sz){popups.push({x,y,txt,col,sz:sz||13,t:0,vy:-1.2});}
function updatePopups(){popups=popups.filter(p=>p.t<44);for(const p of popups){p.t++;p.y+=p.vy;p.vy*=0.94;}}
function drawPopups(){
  for(const p of popups){
    const al=p.t<30?1:1-(p.t-30)/14;
    ctx.globalAlpha=al;ctx.fillStyle=p.col;
    ctx.font=`bold ${p.sz}px Courier New`;ctx.textAlign='center';
    ctx.fillText(p.txt,p.x,p.y);
  }
  ctx.globalAlpha=1;
}
function updateThrown(){
  thrown=thrown.filter(b=>b.x<W+60&&b.alive);
  for(const b of thrown){
    b.x+=b.vx;b.y+=b.vy;b.vy+=0.28;
    // hit any obstacle
    for(const o of E.obs){
      if(o.destroyed||o.t==='hole'||o.t==='warp_pipe')continue;
      const ox=o.x,oy=o.y,ow=o.w,oh=o.h;
      if(b.x>ox&&b.x<ox+ow&&b.y>oy-oh&&b.y<oy){
        o.destroyed=true;b.alive=false;pts+=80;
        spawnExplosion(ox+ow/2,oy-oh/2);break;
      }
    }
    if(!b.alive)continue;
    // hit ep4 special enemies
    for(const en of (E.enemies4||[])){
      if(!en.alive)continue;
      if(b.x>en.x&&b.x<en.x+58&&b.y>en.y-92&&b.y<en.y){
        en.alive=false;b.alive=false;pts+=150;
        spawnExplosion(en.x+29,en.y-46);break;
      }
    }
  }
  E.obs=E.obs.filter(o=>!o.destroyed);
}
function spawnExplosion(x,y){explosions.push({x,y,t:0});}
function updateExplosions(){explosions=explosions.filter(e=>e.t<22);for(const e of explosions)e.t++;}
function drawThrown(){
  for(const b of thrown){
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.x*0.08);
    ctx.fillStyle='#6A1B9A';ctx.fillRect(-7,-9,14,18);
    ctx.fillStyle='#AB47BC';ctx.fillRect(-5,-7,10,14);
    ctx.fillStyle='#FFD700';ctx.fillRect(4,-6,2,12);
    ctx.restore();
  }
  for(const e of explosions){
    const r=8+e.t*3,al=1-e.t/22;
    ctx.globalAlpha=al;
    ctx.fillStyle='#FF6D00';ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FFEA00';ctx.beginPath();ctx.arc(e.x,e.y,r*0.55,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}

// ── stories ──
const STORIES={
  1:["★ EPISODIO 1: Banfield en Bici ★","Pablo trabaja de repartidor en Rappi. Y también es filósofo. No uno u otro: las dos cosas al mismo tiempo.","Hoy tiene una entrega urgente para su amigo Manuel Ferreyra —DJ— en la Cancha de Banfield.","El camino está lleno de baches, perros y colectivos del 542.","Hay libros de filosofía flotando: agárralos para recuperar vida. X = arrojá un libro para destruir obstáculos.","[ ESPACIO o TOQUE para saltar — ¡a jugar! ]"],
  2:["★ EPISODIO 2: Caminando a Córdoba ★","La bici quedó en Banfield. Pablo camina hacia San Francisco, Córdoba.","Lleva hamburguesas para su amigo Franco Fenoglio. Las sierras lo llaman.","Paso lento. Pensamiento veloz. Cuidado con las raquetas de paddle y las redes.","\"El sabio no teme el camino largo; lo atraviesa con método.\" — Epicteto","[ ESPACIO o TOQUE para saltar · X = arrojar libro ]"],
  3:["★ EPISODIO 3: Misión BERSA ★","BERSA. Fábrica de armas. Ramos Mejía.","Pablo tiene un paquete para Ariel Flores. La única forma: agarrarse de un camión en bici.","Velocidad extrema. El viento borra los pensamientos platónicos.","⚠ AVISO: Este episodio tiene un final predeterminado por el universo.","\"No todo lo que viene puede evitarse. Pero puede aceptarse.\" — Marco Aurelio"],
  4:["★ EPISODIO 4: El Plano Espectral ★","El camión fue más rápido. Pero Pablo no puede morir todavía.","Su alma pedalea por el cielo de Lomas de Zamora.","Debés entregar paquetes a Sócrates y Platón. Pero primero: Einstein, el Papa, Jimi Hendrix y Alberto Nisman te bloquean el camino.","¡Arrojá libros para eliminarlos! Flechas = volar libre en todas direcciones.","[ X = libro · Flechas = volar · ESPACIO = impulso ]"],
  5:["★ EPISODIO 5: Vuelta a Casa ★","Vivo. Sus huesos duelen. Eso es una buena señal.","Hay una dirección. Una sola. La de siempre.","Al final de esa calle lo espera todo lo que importa de verdad.","\"La filosofía me enseñó a pensar. Ellas me enseñaron a sentir.\"","[ Llegá a casa. Último episodio. ]"]
};

function showDlg(n){DLG.lines=STORIES[n];DLG.i=0;gs='dlg';}
function advDlg(){DLG.i++;if(DLG.i>=DLG.lines.length){gs='play';initE(ep);}}

const SPDS={1:5.0,2:2.4,3:14,4:3.5,5:4.5};
const GOALS={1:1500,2:1200,3:2000,4:1800,5:1300};
const SPIS={1:88,2:118,3:58,4:110,5:108};

function startEp(n){
  ep=n;hp=100;lives=4;
  if(n===1){pts=0;coins=0;booksGot=0;}
  combo=0;comboT=0;popups=[];
  showDlg(n);
}
function retryEp(){
  lives--;
  if(lives<=0){resetAll();return;}
  hp=100;combo=0;comboT=0;popups=[];
  gs='play';initE(ep);
}
function initE(n){
  E={spd:SPDS[n],bx:[0,0,0],obs:[],col:[],progress:0,goal:GOALS[n],scd:SPIS[n],phase:'run',
     bigTruck:null,warpSpawned:false,
     soc:{sx:9999,active:false,done:false},
     plat:{sx:9999,active:false,done:false},
     enemies4:[],enemy4Timer:260,enemy4Idx:0,
     // fun extras
     eventTimer:180+Math.random()*200, eventActive:false, eventType:'',eventDur:0,
     turbo:false,turboT:0, booksThrown:0,
     // warp tube animation
     warp:{phase:null,t:0,exitX:0,exitTube:null}};
  const mode=n===2?'walk':n===4?'ghost':'bike';
  P={x:PX,y:n===4?H*0.38:FY,vy:0,gnd:n!==4,tick:0,mode,duck:false,big:false,bigT:0,jumps:0};
  thrown=[];explosions=[];
}
function nextEp(){if(ep===5){gs='ending';endT=0;}else startEp(ep+1);}
function resetAll(){ep=1;hp=100;pts=0;coins=0;booksGot=0;lives=4;combo=0;comboT=0;popups=[];gs='title';}


// ── spawn ──
function spawn(){
  const r=Math.random();
  if(ep===1){
    if(r<0.28)E.obs.push({t:'hole',x:W+90,y:FY,w:46,h:13});
    else if(r<0.52)E.obs.push({t:'dog',x:W+90,y:FY,w:44,h:26});
    else if(r<0.76)E.obs.push({t:'bus',x:W+90,y:FY,w:132,h:90});
    else E.obs.push({t:'car',x:W+90,y:FY,w:78,h:58});
    if(Math.random()<0.55)E.col.push({t:'book',x:W+180+r*130,y:FY-115-r*40,done:false});
    spawnExtras();
  }else if(ep===2){
    if(r<0.38)E.obs.push({t:'rock',x:W+90,y:FY,w:34,h:26});
    else if(r<0.68)E.obs.push({t:'paddle_racket',x:W+90,y:FY,w:34,h:62});
    else E.obs.push({t:'paddle_net',x:W+90,y:FY,w:58,h:74});
    if(Math.random()<0.55)E.col.push({t:'burger',x:W+155+r*115,y:FY-58,done:false});
    spawnExtras();
  }else if(ep===3){
    if(r<0.30)E.obs.push({t:'rifle',x:W+90,y:FY,w:72,h:18});
    else if(r<0.56)E.obs.push({t:'pistol',x:W+90,y:FY,w:44,h:18});
    else if(r<0.76)E.obs.push({t:'grenade',x:W+90,y:FY,w:24,h:32});
    else E.obs.push({t:'knife',x:W+90,y:FY,w:14,h:38});
    if(Math.random()<0.55)E.col.push({t:'book',x:W+180+r*130,y:FY-115-r*40,done:false});
    spawnExtras();
  }else if(ep===4){
    if(r<0.55){const oy=70+r*(H-200);E.obs.push({t:'dcloud',x:W+90,y:oy,w:118,h:42});}
    if(Math.random()<0.50)E.col.push({t:'pkg',x:W+170+r*90,y:70+r*(H-200),done:false});
  }else if(ep===5){
    if(r<0.40)E.obs.push({t:'hole',x:W+90,y:FY,w:38,h:11});
    else if(r<0.72)E.obs.push({t:'dog',x:W+90,y:FY,w:40,h:24});
    else E.obs.push({t:'cat',x:W+90,y:FY,w:30,h:22});
    if(Math.random()<0.42)E.col.push({t:'book',x:W+170+r*115,y:FY-112-r*32,done:false});
    spawnExtras();
  }
}
function spawnExtras(){
  if(Math.random()<0.38)E.col.push({t:'coin',x:W+130+Math.random()*150,y:FY-76-Math.random()*55,done:false});
  if(Math.random()<0.10)E.col.push({t:'mushroom',x:W+200+Math.random()*100,y:FY-36,done:false});
  if(!E.warpSpawned&&E.progress>E.goal*0.30&&Math.random()<0.04){
    E.obs.push({t:'warp_pipe',x:W+90,y:FY,w:46,h:56,used:false});E.warpSpawned=true;
  }
}

// ── collisions ──
function checkCols(){
  if(invT>0)return;
  const duck=P.duck;
  const ph=duck?38:(P.mode==='ghost'?70:86);
  const pw=duck?48:40;
  const pL=P.x-pw/2,pR=P.x+pw/2,pT=P.y-ph;
  let hit=false;
  for(const o of E.obs){
    if(o.destroyed)continue;
    let c=false;
    if(o.t==='hole'){if(P.gnd&&P.x>o.x&&P.x<o.x+o.w)c=true;}
    else if(o.t==='warp_pipe'){
      if(!o.used&&P.gnd&&Math.abs(P.x-(o.x+o.w/2))<32&&E.warp.phase===null){
        o.used=true;
        E.warp.phase='enter';E.warp.t=0;
        E.warp.enterX=o.x+o.w/2; // tube Pablo enters
        E.warp.exitX=Math.min(W+300, o.x+o.w/2+520); // exit tube spawns ahead
        E.warp.exitTube={x:E.warp.exitX,y:FY,w:46,h:56};
        // progress jump happens on exit
        pts+=120;
        addPopup(P.x,P.y-90,'★ TUBO WARP!','#00FF66',16);
      }
    }else if(o.t==='bus'){
      if(!duck){
        const oL=o.x,oR=o.x+o.w,oT=o.y-o.h,oB=o.y-46;
        if(pR>oL+6&&pL<oR-6&&pT<oB&&P.y>oT)c=true;
      }
    }else{
      const oL=o.x,oR=o.x+o.w,oT=o.y-o.h,oB=o.y;
      if(pR>oL+6&&pL<oR-6&&pT<oB-4&&P.y>oT+4)c=true;
    }
    if(c){hit=true;break;}
  }
  if(hit){
    hp=Math.max(0,hp-(ep===4?12:22));sh=26;invT=84;
    combo=0;comboT=0; // reset combo on hit
    addPopup(P.x,P.y-90,'¡AUCH!','#E53935',15);
    if(hp<=0&&ep!==3){gs='gameover';if(pts>hiscore)hiscore=pts;}
  }
  // collectibles - generous hitbox
  for(const c of E.col){
    if(c.done)continue;
    if(Math.hypot(P.x-(c.x+14),(P.y-44)-(c.y+14))<58){
      c.done=true;combo++;comboT=90;
      const mult=Math.min(combo,5);
      if(c.t==='book'||c.t==='pkg'){
        hp=Math.min(100,hp+30);pts+=30*mult;booksGot++;
        addPopup(c.x,c.y,combo>2?`📚x${combo}!`:'📚+vida',combo>2?'#FF44FF':'#AB47BC',combo>2?16:13);
      }else if(c.t==='burger'){
        hp=Math.min(100,hp+20);pts+=50*mult;
        addPopup(c.x,c.y,'🍔+'+20,'#FF9800',13);
      }else if(c.t==='coin'){
        pts+=25*mult;coins++;
        addPopup(c.x,c.y,combo>2?`💰x${combo}!`:'💰+25',combo>2?'#FFD700':'#FFCA28',combo>2?16:12);
      }else if(c.t==='mushroom'){
        hp=Math.min(100,hp+42);pts+=100;P.big=true;P.bigT=300;
        addPopup(c.x,c.y,'🍄 ¡GRANDE!','#E53935',16);
      }
    }
  }
  if(ep===4){
    if(E.soc.active&&!E.soc.done&&Math.hypot(P.x-E.soc.sx,P.y-(H*0.40))<80){E.soc.done=true;hp=Math.min(100,hp+40);pts+=200;}
    if(E.plat.active&&!E.plat.done&&Math.hypot(P.x-E.plat.sx,P.y-(H*0.40))<80){E.plat.done=true;hp=Math.min(100,hp+40);pts+=200;}
  }
}

// ── update ──
function update(){
  fr++;if(sh>0)sh--;if(invT>0)invT--;
  if(gs==='crash'){updateCrash();return;}
  if(gs==='ending'){endT++;return;}
  if(gs!=='play')return;
  P.tick++;
  if(P.big){P.bigT--;if(P.bigT<=0)P.big=false;}
  // combo timer
  if(comboT>0){comboT--;if(comboT===0)combo=0;}
  updatePopups();
  // turbo
  if(E.turbo){E.turboT--;if(E.turboT<=0){E.turbo=false;E.spd=SPDS[ep];}}
  const baseSpd=E.turbo?E.spd:SPDS[ep]+Math.min(4,E.progress*0.002);
  E.spd=E.turbo?Math.min(baseSpd+8,22):baseSpd;
  // random events (not ep3/ep4)
  if(ep!==3&&ep!==4){
    E.eventTimer--;
    if(E.eventTimer<=0&&!E.eventActive){
      E.eventActive=true;E.eventDur=220;
      const evts=['turbo','coin_shower','slow','shield'];
      E.eventType=evts[Math.floor(Math.random()*evts.length)];
      if(E.eventType==='turbo')addTurbo();
      else if(E.eventType==='coin_shower'){for(let ci=0;ci<6;ci++)E.col.push({t:'coin',x:W+90+ci*60,y:FY-80-Math.random()*60,done:false});addPopup(W/2,H/2-60,'💰 ¡LLUVIA DE MONEDAS!','#FFD700',18);}
      else if(E.eventType==='slow'){E.spd=SPDS[ep]*0.45;addPopup(W/2,H/2-60,'🐢 ¡CÁMARA LENTA!','#4FC3F7',16);}
      else if(E.eventType==='shield'){invT=240;addPopup(P.x,P.y-100,'🛡 ¡ESCUDO!','#76FF03',18);}
      E.eventTimer=280+Math.random()*220;
    }
    if(E.eventActive){E.eventDur--;if(E.eventDur<=0){E.eventActive=false;if(E.eventType==='slow')E.spd=SPDS[ep];}}
  }

  if(ep===4){
    // Free flight with arrow keys
    if(K.up)P.vy=Math.min(P.vy,GFL*0.9);
    if(K.down)P.vy=Math.max(P.vy,4);
    if(K.left)P.x=Math.max(24,P.x-3.5);
    if(K.right)P.x=Math.min(W-24,P.x+3.5);
    P.vy=Math.min(P.vy+GGR,8);
    P.y=Math.max(32,Math.min(H-48,P.y+P.vy));
    // ep4 special enemies
    E.enemy4Timer--;
    const ep4types=['einstein','papa','hendrix','nisman'];
    if(E.enemy4Timer<=0&&E.enemy4Idx<4){
      E.enemies4.push({t:ep4types[E.enemy4Idx++],x:W+70,y:70+Math.random()*(H-200),alive:true,vy:(Math.random()-0.5)*1.4,tick:0});
      E.enemy4Timer=220;
    }
    for(const en of E.enemies4){
      if(!en.alive)continue;
      en.tick++;en.x-=E.spd*0.65;en.y+=en.vy;
      if(en.y<40||en.y>H-90)en.vy*=-1;
    }
    E.enemies4=E.enemies4.filter(en=>en.x>-130);
  }else{
    P.vy=Math.min(P.vy+GR,22);P.y+=P.vy;
    if(P.y>=FY){P.y=FY;P.vy=0;P.gnd=true;P.jumps=0;}
  }

  updateThrown();updateExplosions();
  // ── warp tube animation ──
  if(E.warp.phase){
    E.warp.t++;
    if(E.warp.phase==='enter'){
      // Pablo sinks into tube for 28 frames
      P.y=Math.min(FY+50,FY+(E.warp.t/28)*52);
      if(E.warp.t>=28){
        E.warp.phase='transit';E.warp.t=0;
        sh=8;
      }
    }else if(E.warp.phase==='transit'){
      // Screen flashes green, progress jumps, 20 frames darkness
      if(E.warp.t===1){
        E.progress=Math.min(E.goal*0.90,E.progress+E.goal*0.35);
        // coin shower on exit
        const ex=E.warp.exitTube?E.warp.exitTube.x:W/2;
        for(let wc=0;wc<6;wc++)E.col.push({t:'coin',x:ex+wc*28-70,y:FY-80-Math.random()*55,done:false});
      }
      if(E.warp.t>=20){
        E.warp.phase='exit';E.warp.t=0;
        P.x=E.warp.exitX||PX;
        P.y=FY+40; // start below tube opening
        P.vy=-10;  // pop up out of tube
        P.gnd=false;
      }
    }else if(E.warp.phase==='exit'){
      // Pablo pops out of exit tube, 40 frames
      if(E.warp.t>=40){
        E.warp.phase=null;E.warp.t=0;
        E.warp.exitTube=null;
        P.x=PX; // snap back to normal x
      }
    }
  }
  const spd=E.spd;
  for(let i=0;i<3;i++)E.bx[i]-=spd*[0.15,0.42,1.0][i];
  E.progress+=spd*0.055;
  E.obs=E.obs.filter(o=>{o.x-=spd;return o.x>-260&&!o.destroyed;});
  E.col=E.col.filter(c=>{c.x-=spd;return c.x>-100&&!c.done;});
  // scroll exit tube
  if(E.warp.exitTube){E.warp.exitTube.x-=spd;}
  E.scd--;
  if(E.scd<=0&&E.phase==='run'){spawn();E.scd=Math.max(36,SPIS[ep]-Math.floor(E.progress*0.028));}
  hp=Math.max(0,hp-0.016*(ep===3?2:1));
  if(hp<=0&&ep!==3&&gs==='play'){gs='gameover';if(pts>hiscore)hiscore=pts;}
  checkCols();if(gs!=='play')return;
  if(ep===1||ep===2||ep===5){
    if(E.progress>=E.goal){gs='ep_end';if(pts>hiscore)hiscore=pts;}
  }else if(ep===3){
    if(E.progress>=E.goal*0.76&&E.phase==='run'){E.phase='truck';E.bigTruck={x:W+300};}
    if(E.phase==='truck'&&E.bigTruck){E.bigTruck.x-=22;if(E.bigTruck.x<P.x+95){gs='crash';crashT=0;sh=70;}}
  }else if(ep===4){
    if(!E.soc.active&&E.progress>=E.goal*0.52){E.soc.active=true;E.soc.sx=W+120;}
    if(!E.plat.active&&E.progress>=E.goal*0.80){E.plat.active=true;E.plat.sx=W+120;}
    if(E.soc.active&&!E.soc.done)E.soc.sx=Math.max(210,E.soc.sx-spd);
    if(E.plat.active&&!E.plat.done)E.plat.sx=Math.max(210,E.plat.sx-spd);
    if(E.progress>=E.goal&&E.soc.done&&E.plat.done){gs='ep_end';if(pts>hiscore)hiscore=pts;}
  }
}

    const cy=((rng(ci*11)*H*0.65+fr*(0.7+rng(ci*11+1)*1.4))%(FY-28)+rng(ci*11+2)*38)%FY;
    const crot=fr*0.07+ci*0.8;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(crot);
    ctx.fillStyle=confColors[ci%confColors.length];
    if(ci%3===0)ctx.fillRect(-4,-2,8,4);
    else{ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }

  // ── Fireworks ──
  for(let fw=0;fw<5;fw++){
    const fwt=Math.floor(fr*0.65+fw*22)%90;
    if(fwt<22){
      const fwx=80+fw*160+Math.sin(fw*1.9+fr*0.01)*30;
      const fwy=28+rng(fw*7)*90;
      const fwr=fwt*4.2,fwal=1-fwt/22;

      for(let ray=0;ray<14;ray++){

        ctx.strokeStyle=fwc;ctx.lineWidth=2.2;
        ctx.beginPath();ctx.moveTo(fwx+Math.cos(ra)*5,fwy+Math.sin(ra)*5);
        ctx.lineTo(fwx+Math.cos(ra)*fwr,fwy+Math.sin(ra)*fwr);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
  }

  // ── Ground: green grass, Banfield colors ──
  ctx.fillStyle='#1A6A1A';ctx.fillRect(0,FY-58,W,16);
  ctx.fillStyle='#145414';ctx.fillRect(0,FY-42,W,H-FY+42);
  // Grass stripes
  for(let gs3=0;gs3<10;gs3++){
    ctx.fillStyle=gs3%2===0?'rgba(0,0,0,0.07)':'rgba(255,255,255,0.03)';
    ctx.fillRect(gs3*(W/10),FY-42,(W/10),H-FY+42);
  }
  ctx.strokeStyle='#2A7A2A';ctx.lineWidth=2;ctx.setLineDash([20,16]);ctx.lineDashOffset=-(bx[2]%36);
  ctx.beginPath();ctx.moveTo(0,FY+10);ctx.lineTo(W,FY+10);ctx.stroke();ctx.setLineDash([]);
}

// ── pablo sprites ──
function drawPablo(){
  const scale=P.big?1.42:1;ctx.save();
  if(scale!==1){ctx.translate(P.x,P.y);ctx.scale(scale,scale);ctx.translate(-P.x,-P.y);}
  if(ep===3&&E.phase==='run'){
    // EP3: Pablo rides clinging to the side of a truck
    drawTruckWithPablo(P.x-22,FY);
  } else if(P.duck&&P.mode!=='ghost'){
    ctx.save();ctx.translate(P.x,P.y);ctx.scale(1,0.45);ctx.translate(-P.x,-P.y);drawBikePablo(P.x,P.y,false);ctx.restore();
  }
  else if(P.mode==='ghost')drawGhostPablo(P.x,P.y);
  else if(P.mode==='walk')drawWalkPablo(P.x,P.y);
  else drawBikePablo(P.x,P.y,false);

  ctx.restore();
}

// ── obstacles ──
function drawObstacles(){
  for(const o of E.obs){
    if(o.destroyed||o.x<-210||o.x>W+210)continue;
    ctx.save();
    if(o.t==='hole'){
      ctx.fillStyle='#141414';ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y-5,o.w/2,9,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,88,0,0.92)';ctx.font='10px serif';ctx.textAlign='center';ctx.fillText('⚠',o.x+o.w/2,o.y-18);
    }else if(o.t==='dog')drawDog(o.x,o.y);
    else if(o.t==='bus'){drawBus(o.x,o.y,'#1B5E20',ep===1?'542':'160');ctx.fillStyle='rgba(255,230,0,0.9)';ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.fillText('↓ AGACHATE',o.x+65,o.y-98);}
    else if(o.t==='car')drawCar(o.x,o.y,58);

    else if(o.t==='paddle_net'){const nx=o.x,ny=o.y;ctx.fillStyle='#888';ctx.fillRect(nx,ny-o.h,6,o.h);ctx.fillRect(nx+o.w-6,ny-o.h,6,o.h);ctx.strokeStyle='rgba(255,255,255,0.65)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(nx,ny-o.h);ctx.lineTo(nx+o.w,ny-o.h);ctx.stroke();ctx.beginPath();ctx.moveTo(nx,ny-o.h/2);ctx.lineTo(nx+o.w,ny-o.h/2);ctx.stroke();for(let nxi=0;nxi<=5;nxi++){ctx.beginPath();ctx.moveTo(nx+nxi*(o.w/5),ny-o.h);ctx.lineTo(nx+nxi*(o.w/5),ny);ctx.stroke();}ctx.fillStyle='rgba(255,235,0,0.9)';ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.fillText('↑ SALTÁ',nx+o.w/2,ny-o.h-10);}
    else if(o.t==='rifle'){const rx=o.x,ry=o.y;ctx.save();ctx.translate(rx+36,ry-9);ctx.fillStyle='#3A2800';ctx.fillRect(-36,-5,28,10);ctx.fillStyle='#555';ctx.fillRect(-8,-4,54,8);ctx.fillStyle='#333';ctx.fillRect(40,-3,8,6);ctx.fillStyle='#222';ctx.fillRect(2,-9,18,5);ctx.fillStyle='#444';ctx.fillRect(-4,-4,4,12);ctx.restore();ctx.fillStyle='rgba(255,80,0,0.9)';ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.fillText('X/↑',rx+36,ry-26);}
    else if(o.t==='pistol'){const rx=o.x,ry=o.y;ctx.save();ctx.translate(rx+22,ry-9);ctx.fillStyle='#4A3020';ctx.fillRect(-22,-4,36,8);ctx.fillStyle='#3A2010';ctx.fillRect(-20,-4,14,16);ctx.fillStyle='#555';ctx.fillRect(-22,-4,36,4);ctx.restore();ctx.fillStyle='rgba(255,80,0,0.9)';ctx.font='bold 8px Courier New';ctx.textAlign='center';ctx.fillText('X/↑',rx+22,ry-22);}
    else if(o.t==='grenade'){const gx=o.x+12,gy=o.y,bounce=Math.abs(Math.sin(fr*0.14))*14;ctx.save();ctx.translate(gx,gy-16-bounce);ctx.fillStyle='#2A4A1A';ctx.beginPath();ctx.ellipse(0,0,9,11,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1A3A0A';ctx.lineWidth=1.5;for(let line2=-5;line2<=5;line2+=5){ctx.beginPath();ctx.moveTo(-9,line2);ctx.lineTo(9,line2);ctx.stroke();}ctx.fillStyle='#666';ctx.fillRect(-3,-14,6,4);if(Math.floor(fr/4)%2){ctx.fillStyle='#FF8C00';ctx.beginPath();ctx.arc(0,-17,3,0,Math.PI*2);ctx.fill();}ctx.restore();}
    else if(o.t==='knife'){const kx=o.x+7,ky=o.y-19,spin=fr*0.10;ctx.save();ctx.translate(kx,ky);ctx.rotate(spin);ctx.fillStyle='#CCCCDD';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(4,6);ctx.lineTo(0,2);ctx.lineTo(-4,6);ctx.closePath();ctx.fill();ctx.fillStyle='#888';ctx.fillRect(-5,4,10,4);ctx.fillStyle='#4A2800';ctx.fillRect(-4,8,8,12);ctx.restore();}
    else if(o.t==='dcloud'){ctx.fillStyle='rgba(55,66,98,0.90)';ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(o.x+o.w*0.3,o.y+o.h*0.2,o.w*0.3,o.h*0.4,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(o.x+o.w*0.72,o.y+o.h*0.2,o.w*0.28,o.h*0.4,0,0,Math.PI*2);ctx.fill();}
    else if(o.t==='cat')drawCat(o.x,o.y);
    else if(o.t==='warp_pipe'){
      const pw=o.w,px2=o.x,py2=o.y,ph=o.h;

      // Dark inside
      ctx.fillStyle='#0A4A0A';ctx.fillRect(px2+5,py2-ph+18,pw-10,ph-28);
      // Shimmer inside
      ctx.fillStyle=`rgba(0,255,100,${pglow*0.35})`;ctx.fillRect(px2+5,py2-ph+18,pw-10,8);
      // Bounce arrow ↓
      const ab=Math.sin(fr*0.18)*4;

      ctx.fillText('WARP!',px2+pw/2,py2-ph-18+ab);
    }
    ctx.restore();
  }
}

  if(endT>48){
    const rp=Math.min(1,(endT-48)/80);
    const rx=hx-30-(1-rp)*360;
    drawReginaTais(rx,by2,rp);
  }
  ctx.globalAlpha=1;
  // Captions
  const caps=[
    {t:80,text:'¡PABLO!',color:'#FF6030',fy:H*0.16,size:30,bold:true},
    {t:104,text:'¡Papi! ¡Papi!',color:'#FFD700',fy:H*0.12,size:26,bold:true},
    {t:132,text:'¡Olivia, tranquila!',color:'#EEE',fy:H*0.22,size:13,bold:false},
    {t:168,text:'"Llegué."',color:'#FFF',fy:H*0.09,size:20,bold:false},
    {t:210,text:'— FIN —',color:'#F5C518',fy:H*0.07,size:22,bold:true},
    {t:240,text:'"La filosofía me enseñó a pensar. Ellas me enseñaron a sentir." — Pablo',color:'#CCC',fy:H*0.05,size:10,bold:false},
  ];
  for(const cap of caps){if(endT>cap.t){const al=Math.min(1,(endT-cap.t)/22);ctx.globalAlpha=al;ctx.fillStyle=cap.color;ctx.font=(cap.bold?'bold ':'')+cap.size+'px Courier New';ctx.textAlign='center';ctx.fillText(cap.text,W/2,cap.fy);ctx.globalAlpha=1;}}
  if(endT>300){const blink=Math.floor(fr/22)%2;if(blink){ctx.fillStyle='rgba(0,0,0,0.62)';ctx.beginPath();ctx.roundRect(W/2-145,H-44,290,30,7);ctx.fill();ctx.fillStyle='#4CAF50';ctx.font='bold 11px Courier New';ctx.textAlign='center';ctx.fillText('[ ESPACIO · CLIC para volver al inicio ]',W/2,H-24);}}
}

// ── Family sprites ──
function drawOlivia(x,y,progress){
  const run=Math.floor(fr/5)%2;ctx.save();ctx.translate(x,y);ctx.globalAlpha=progress;
  ctx.fillStyle='#F2F2F2';ctx.fillRect(-16,-18,30,14);ctx.fillStyle='#DDD';ctx.beginPath();ctx.ellipse(-2,-8,7,6,0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ECECEC';ctx.beginPath();ctx.arc(14,-22,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#CCCCCC';ctx.fillRect(11,-32,5,9);ctx.fillRect(18,-32,5,9);
  ctx.fillStyle='#1A1A1A';ctx.beginPath();ctx.arc(12,-22,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(18,-22,2.5,0,Math.PI*2);ctx.fill();
  const lo=run?4:-4;ctx.fillStyle='#E0E0E0';ctx.fillRect(-12,-4+lo,6,12-lo);ctx.fillRect(-4,-4-lo,6,12+lo);ctx.fillRect(4,-4+lo,6,12-lo);ctx.fillRect(10,-4-lo,6,12+lo);
  ctx.strokeStyle='#ECECEC';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-16,-12);ctx.quadraticCurveTo(-30,-28,-22,-36);ctx.stroke();
  if(progress>0.6){ctx.fillStyle='rgba(200,200,200,0.85)';ctx.font='12px serif';ctx.textAlign='center';ctx.fillText('🐾',0,-40);}
  ctx.globalAlpha=1;ctx.restore();
}
function drawLove(x,y,progress){
  // Princess — morocha, ojos verdes — PIES EN EL SUELO (y=ground)
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=progress;
  // Piernas (pies en y=0)
  ctx.fillStyle='#C8845A';ctx.fillRect(-6,0,10,0);// base
  // Vestido rojo elegante — parte inferior amplia
  ctx.fillStyle='#C62828';
  ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(-14,-52);ctx.lineTo(14,-52);ctx.lineTo(20,0);ctx.closePath();ctx.fill();
  // Pliegues del vestido
  ctx.strokeStyle='rgba(0,0,0,0.14)';ctx.lineWidth=1;for(let f=-12;f<14;f+=6){ctx.beginPath();ctx.moveTo(f,-52);ctx.lineTo(f-4,0);ctx.stroke();}
  // Parte superior del vestido
  ctx.fillStyle='#B71C1C';ctx.fillRect(-12,-76,24,26);
  // Collar/escote
  ctx.fillStyle='#C62828';ctx.beginPath();ctx.moveTo(-12,-76);ctx.lineTo(0,-66);ctx.lineTo(12,-76);ctx.fill();
  // Brazos abiertos, extendidos — cuerpo entero visible
  ctx.strokeStyle='#C8845A';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-12,-72);ctx.lineTo(-32,-58);ctx.stroke();ctx.beginPath();ctx.moveTo(12,-72);ctx.lineTo(32,-58);ctx.stroke();
  // Manos
  ctx.fillStyle='#C8845A';ctx.beginPath();ctx.arc(-32,-58,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(32,-58,5,0,Math.PI*2);ctx.fill();
  // Cabello largo oscuro (morocha)
  ctx.fillStyle='#180800';ctx.beginPath();ctx.arc(0,-88,14,0,Math.PI*2);ctx.fill();ctx.fillRect(-14,-98,7,50);ctx.fillRect(7,-98,7,46);
  // Ondas del cabello
  ctx.strokeStyle='#2A1000';ctx.lineWidth=2;for(let wi=0;wi<3;wi++){ctx.beginPath();ctx.moveTo(-13,-90+wi*14);ctx.quadraticCurveTo(-20,-84+wi*14,-14,-78+wi*14);ctx.stroke();}
  // Rostro
  ctx.fillStyle='#C8845A';ctx.beginPath();ctx.arc(0,-88,11,0,Math.PI*2);ctx.fill();
  // Ojos verdes — prominentes y brillantes
  ctx.fillStyle='#1B5E20';ctx.beginPath();ctx.ellipse(-4,-89,4.5,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1B5E20';ctx.beginPath();ctx.ellipse(4,-89,4.5,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4CAF50';ctx.beginPath();ctx.ellipse(-4,-89,2.5,2.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4CAF50';ctx.beginPath();ctx.ellipse(4,-89,2.5,2.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(-3,-90,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(5,-90,1,0,Math.PI*2);ctx.fill();
  // Sonrisa
  ctx.strokeStyle='#9B3A10';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(0,-84,5,0.15,Math.PI-0.15);ctx.stroke();
  // Corazones
  if(progress>=1&&endT>165){const hb=Math.sin(fr*0.12)*0.3+0.7;ctx.fillStyle=`rgba(255,80,120,${hb})`;ctx.font='18px serif';ctx.textAlign='center';ctx.fillText('❤',40,-106);ctx.fillText('❤',-40,-100);}
  ctx.globalAlpha=1;ctx.restore();
}
function drawReginaTais(x,y,progress){
  const sc=0.60,run=Math.floor(fr/5)%2;
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.globalAlpha=progress;
  // Piernas (pies en y=0)
  ctx.fillStyle='#37474F';ctx.save();ctx.rotate(run?0.30:-0.30);ctx.fillRect(-5,-30,10,25);ctx.fillStyle='#E53935';ctx.fillRect(-7,-5,12,7);ctx.restore();
  ctx.save();ctx.rotate(run?-0.30:0.30);ctx.fillRect(-4,-32,10,25);ctx.fillStyle='#E53935';ctx.fillRect(-6,-7,12,7);ctx.restore();
  // Vestido rosa (cuerpo entero)
  ctx.fillStyle='#F48FB1';ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-14,-52);ctx.lineTo(14,-52);ctx.lineTo(18,0);ctx.closePath();ctx.fill();ctx.fillStyle='#F06292';ctx.fillRect(-12,-68,24,18);
  // Cabello oscuro con colitas
  ctx.fillStyle='#1A0800';ctx.beginPath();ctx.arc(0,-70,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#F8BBD9';ctx.beginPath();ctx.arc(-20,-68,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(20,-68,5,0,Math.PI*2);ctx.fill();
  // Carita
  ctx.fillStyle='#C8845A';ctx.beginPath();ctx.arc(0,-70,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1A0800';ctx.beginPath();ctx.arc(-4,-71,3.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-71,3.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#8B2500';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-66,5,0.1,Math.PI-0.1);ctx.stroke();
  // Bracitos hacia arriba
  ctx.strokeStyle='#C8845A';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-14,-56);ctx.lineTo(-28,-42);ctx.stroke();ctx.beginPath();ctx.moveTo(14,-56);ctx.lineTo(28,-42);ctx.stroke();
  ctx.fillStyle='#C8845A';ctx.beginPath();ctx.arc(-28,-42,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(28,-42,5,0,Math.PI*2);ctx.fill();
  // Burbuja
  if(progress>0.5&&x>80){ctx.fillStyle='rgba(255,255,255,0.97)';ctx.beginPath();ctx.roundRect(-34,-98,68,22,6);ctx.fill();ctx.fillStyle='#C62828';ctx.font='bold 13px Courier New';ctx.textAlign='center';ctx.fillText('¡PAPI!',0,-82);}
  ctx.globalAlpha=1;ctx.restore();
}

// ── VIRTUAL BUTTONS drawn on canvas ──
function drawVirtualButtons(){
  if(gs==='title'||gs==='ending')return;
  const btns=visibleBtns();
  for(const b of btns){
    const pressed=!!BSTATE[b.id];
    ctx.save();
    ctx.globalAlpha=pressed?0.95:0.68;
    // shadow glow when pressed
    if(pressed){ctx.shadowColor='rgba(255,255,255,0.7)';ctx.shadowBlur=14;}
    // circle
    ctx.fillStyle=b.col;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    // border
    ctx.strokeStyle=pressed?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.45)';
    ctx.lineWidth=pressed?3:2;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
    // label
    ctx.shadowBlur=0;
    const isEmoji=b.label.length>1;
    ctx.font=(isEmoji?'22px':'bold '+(b.r*0.72)+'px Courier New');
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';
    ctx.fillText(b.label,b.x,b.y+(isEmoji?1:1));
    ctx.restore();
  }
  // EP4 label
  if(ep===4&&gs==='play'){
    ctx.globalAlpha=0.55;ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath();ctx.roundRect(W-170,H-148,116,16,4);ctx.fill();
    ctx.globalAlpha=0.9;ctx.fillStyle='#80CFFF';ctx.font='bold 8px Courier New';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('volar libre',W-112,H-140);
    ctx.globalAlpha=1;
  }
}

// ── HUD ──
function drawHUD(){
  if(gs!=='play')return;
  // HP bar
  ctx.fillStyle='rgba(0,0,0,0.80)';ctx.beginPath();ctx.roundRect(8,8,218,30,7);ctx.fill();
  ctx.fillStyle='#111';ctx.fillRect(14,14,204,18);
  const hp2=hp/100,hc=hp2>0.6?'#43A047':hp2>0.3?'#FB8C00':'#E53935';
  if(hp>0){const hg=ctx.createLinearGradient(14,14,14+204*hp2,14);hg.addColorStop(0,hc);hg.addColorStop(1,hp2>0.6?'#76FF03':hp2>0.3?'#FFD740':'#FF5252');ctx.fillStyle=hg;ctx.fillRect(14,14,204*Math.max(0,hp2),18);}
  ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.strokeRect(14,14,204,18);
  ctx.fillStyle='#EEE';ctx.font='bold 10px Courier New';ctx.textAlign='left';ctx.fillText(`❤ ${Math.ceil(hp)}`,18,27);
  // Lives
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.beginPath();ctx.roundRect(8,42,132,22,5);ctx.fill();
  let liveTxt='';for(let i=0;i<4;i++)liveTxt+=(i<lives?'❤':'🖤');
  ctx.fillStyle=lives<=1?'#E53935':lives<=2?'#FB8C00':'#EF9A9A';
  ctx.font='bold 11px Courier New';ctx.textAlign='left';ctx.fillText(liveTxt,13,57);
  // Counters
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.beginPath();ctx.roundRect(8,68,218,22,5);ctx.fill();
  ctx.font='bold 10px Courier New';ctx.textAlign='left';
  ctx.fillStyle='#FFD700';ctx.fillText(`💰 ${coins}`,13,83);
  ctx.fillStyle='#CE93D8';ctx.fillText(`📚 ${booksGot}`,85,83);
  if(combo>=2){const cp=Math.sin(fr*0.18)*0.3+0.7;ctx.fillStyle=`rgba(255,100,255,${cp})`;ctx.fillText(`✦ x${combo}`,160,83);}
  // Score+ep
  ctx.fillStyle='rgba(0,0,0,0.80)';ctx.beginPath();ctx.roundRect(W-178,8,170,30,7);ctx.fill();
  ctx.fillStyle='#F5C518';ctx.font='bold 12px Courier New';ctx.textAlign='right';ctx.fillText(`Pts: ${pts}  [Ep.${ep}/5]`,W-12,28);
  // Turbo
  if(E.turbo){const tp=Math.sin(fr*0.2)*0.35+0.65;ctx.fillStyle=`rgba(255,215,0,${tp})`;ctx.font='bold 12px Courier New';ctx.textAlign='right';ctx.fillText('⚡ TURBO ⚡',W-12,50);}
  // Shield
  if(invT>84){ctx.fillStyle='rgba(118,255,3,0.9)';ctx.font='bold 10px Courier New';ctx.textAlign='right';ctx.fillText('🛡 ESCUDO',W-12,66);}
  // Progress bar
  const pct=Math.min(1,E.progress/E.goal);
  ctx.fillStyle='rgba(0,0,0,0.66)';ctx.beginPath();ctx.roundRect(10,H-22,W-20,12,4);ctx.fill();
  ctx.fillStyle='#111';ctx.fillRect(12,H-20,W-24,8);
  if(pct>0){const pg=ctx.createLinearGradient(12,H-20,12+(W-24)*pct,H-20);pg.addColorStop(0,'#1565C0');pg.addColorStop(1,'#42A5F5');ctx.fillStyle=pg;ctx.fillRect(12,H-20,(W-24)*pct,8);}
  const icons={1:'🚲',2:'🚶',3:'⚡',4:'👻',5:'🏠'};
  ctx.font='12px serif';ctx.textAlign='left';ctx.fillText(icons[ep]||'🚲',Math.max(12,12+(W-24)*pct-6),H-10);ctx.textAlign='right';ctx.fillText('📍',W-14,H-10);
  // damage flash
  if(invT>0&&Math.floor(invT/5)%2===0){ctx.fillStyle='rgba(255,0,0,0.10)';ctx.fillRect(0,0,W,H);}
}

// ── RENDER ──
function render(){
  ctx.clearRect(0,0,W,H);
  const sx=sh>0?(Math.random()-0.5)*sh*0.8:0,sy=sh>0?(Math.random()-0.5)*sh*0.38:0;
  ctx.save();if(sh>0)ctx.translate(sx,sy);
  if(gs==='title')drawTitle();
  else if(gs==='dlg'){const dlgbg={1:'#0E1E0E',2:'#1A130A',3:'#0A0500',4:'#0A1420',5:'#1A1006'};ctx.fillStyle=dlgbg[ep]||'#0A0A0A';ctx.fillRect(0,0,W,H);drawDlg();}
  else if(gs==='play'){
    drawBG();drawCollectibles();drawObstacles();
    // Draw warp exit tube if active
    if(E.warp&&E.warp.exitTube&&(E.warp.phase==='transit'||E.warp.phase==='exit')){
      const et=E.warp.exitTube;
      // scroll with road
      ctx.save();
      const pglow=Math.sin(fr*0.14)*0.4+0.6;
      ctx.fillStyle=`rgba(0,255,100,${pglow*0.22})`;ctx.fillRect(et.x-10,et.y-et.h-10,et.w+20,et.h+18);
      ctx.fillStyle='#1A7A1A';ctx.fillRect(et.x,et.y-et.h+14,et.w,et.h-14);
      ctx.fillStyle='#2EA02E';ctx.fillRect(et.x-6,et.y-et.h,et.w+12,18);
      ctx.fillStyle='#0A4A0A';ctx.fillRect(et.x+5,et.y-et.h+18,et.w-10,et.h-28);
      // Arrow pointing up (exit)
      ctx.fillStyle=`rgba(0,255,100,${pglow})`;ctx.font='bold 14px Courier New';ctx.textAlign='center';
      ctx.fillText('↑',et.x+et.w/2,et.y-et.h-6);
      ctx.restore();
    }
    drawSpecials();drawThrown();drawPablo();
    // Warp flash overlay
    if(E.warp&&E.warp.phase==='transit'){
      const al=Math.sin(E.warp.t/20*Math.PI)*0.82;
      ctx.fillStyle=`rgba(0,255,80,${al})`;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.font='bold 28px Courier New';ctx.textAlign='center';
      ctx.fillText('WARP!',W/2,H/2);
    }
    drawHUD();drawPopups();
  }
  else if(gs==='ep_end'){if(E&&E.bx)drawBG();ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);drawEpEnd();}
  else if(gs==='crash')drawCrash();
  else if(gs==='gameover'){if(E&&E.bx)drawBG();ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);drawGameOver();}
  else if(gs==='ending')drawEnding();
  drawVirtualButtons();
  ctx.restore();
}
(function loop(){update();render();requestAnimationFrame(loop);})();
</script>
