<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pablo: Una Odisea en el Sur</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Courier New', Courier, monospace; color: white; touch-action: none; }
        canvas { display: block; background: #87CEEB; margin: 0 auto; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; text-shadow: 2px 2px #000; z-index: 10; }
        #dialogue { position: absolute; bottom: 20%; width: 100%; text-align: center; font-size: 1.2rem; background: rgba(0,0,0,0.7); padding: 10px 0; display: none; z-index: 10; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="level-title">NIVEL 1: Banfield en Bici</div>
        <div id="stats">Pedido: Caliente | Integridad: 100%</div>
    </div>
    <div id="dialogue"></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dialogueBox = document.getElementById('dialogue');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = 400;
}
window.addEventListener('resize', resize);
resize();

// --- CONFIGURACIÓN DE NIVELES ---
const LEVELS = {
    1: { title: "NIVEL 1: Lomas - El Reparto", bg: "#87CEEB", ground: "#555", speed: 5 },
    2: { title: "NIVEL 2: La Vereda - Caminando", bg: "#a8dadc", ground: "#777", speed: 3 },
    3: { title: "NIVEL 3: Camino Negro - El Camión", bg: "#457b9d", ground: "#333", speed: 12 },
    4: { title: "NIVEL 4: El Plano Espectral", bg: "#1d3557", ground: "#f1faee", speed: 4 }
};

let game = {
    level: 1,
    distance: 0,
    pabloY: 0,
    jumpV: 0,
    isJumping: false,
    obstacles: [],
    frame: 0,
    active: true
};

class Obstacle {
    constructor(x) {
        this.x = x;
        this.w = game.level === 3 ? 100 : 40;
        this.h = game.level === 3 ? 60 : 30;
        this.y = canvas.height - 20 - this.h;
        this.color = game.level === 4 ? "rgba(255,255,255,0.4)" : "#e63946";
    }
    update() { this.x -= LEVELS[game.level].speed; }
    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.w, this.h);
    }
}

function showMessage(txt) {
    dialogueBox.innerText = txt;
    dialogueBox.style.display = 'block';
    setTimeout(() => dialogueBox.style.display = 'none', 3000);
}

function nextLevel(n) {
    game.level = n;
    game.distance = 0;
    game.obstacles = [];
    document.getElementById('level-title').innerText = LEVELS[n].title;
    if(n === 2) showMessage("¡Se rompió la cadena! A caminar...");
    if(n === 3) showMessage("¡A toda velocidad tras el camión!");
}

function update() {
    if(!game.active) return;
    game.frame++;
    game.distance += 1;

    // Física
    if(game.isJumping) {
        game.pabloY += game.jumpV;
        game.jumpV += 0.7;
        if(game.pabloY >= 0) { game.pabloY = 0; game.isJumping = false; }
    }

    // Obstáculos
    if(game.frame % 80 === 0) game.obstacles.push(new Obstacle(canvas.width));
    game.obstacles.forEach((o, i) => {
        o.update();
        if(o.x < -100) game.obstacles.splice(i, 1);
        // Colisión
        if(o.x < 80 && o.x > 30 && game.pabloY > -30) {
            if(game.level === 3) {
                game.level = 4;
                nextLevel(4);
                showMessage("El cuerpo quedó... el alma sigue.");
            }
        }
    });

    // Progresión
    if(game.distance > 800 && game.level === 1) nextLevel(2);
    if(game.distance > 800 && game.level === 2) nextLevel(3);

    draw();
    requestAnimationFrame(update);
}

function draw() {
    const lv = LEVELS[game.level];
    ctx.fillStyle = lv.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = lv.ground;
    ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

    // PABLO
    ctx.fillStyle = game.level === 4 ? "#00f2ff" : "#333";
    ctx.fillRect(50, canvas.height - 70 + game.pabloY, 30, 50); // Pablo
    
    ctx.fillStyle = "#ff5722"; // Mochila
    ctx.fillRect(40, canvas.height - 65 + game.pabloY, 12, 30);

    game.obstacles.forEach(o => o.draw());
}

function jump() { if(!game.isJumping) { game.isJumping = true; game.jumpV = -13; } }
window.addEventListener('keydown', jump);
window.addEventListener('touchstart', jump);

update();
</script>
</body>
</html>
